[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "path-nd-converter"
version = "0.1.0"
description = "EXPERIMENTAL lossless converter from Aperio SVS to NDPI-style files, with a tile-level verifier"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tifffile>=2024.5",
]

[project.optional-dependencies]
jpeg2000 = [
    "imagecodecs>=2024.1",
]
dev = [
    "pytest>=8.0",
    "imagecodecs>=2024.1",
    "openslide-python>=1.3",
    "openslide-bin>=4.0",
]

[project.scripts]
path-nd-converter = "path_nd_converter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/path_nd_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
